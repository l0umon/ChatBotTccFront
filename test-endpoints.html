<!DOCTYPE html>
<html>
<head>
    <title>🧪 Test Endpoints Tickets - Filtros por Rol</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }
        button { margin: 5px; padding: 8px 12px; }
    </style>
</head>
<body>
    <h1>🧪 Test de Filtros de Tickets por Rol</h1>
    
    <div class="test-section">
        <h3>📋 Tests según Especificación Actualizada</h3>
        <button onclick="testTicketFilter('admin_todos=true', '🌐 TODOS los tickets (admin)')">Todos (admin)</button>
        <button onclick="testTicketFilter('ind_alumno=S', '📚 Solo tickets de alumnos')">Solo Alumnos</button>
        <button onclick="testTicketFilter('ind_alumno=N', '👥 Solo tickets de personal')">Solo Personal</button>
        <button onclick="testTicketFilter('ind_alumno=S&estado=abierto', '📚 Tickets abiertos de alumnos')">Alumnos Abiertos</button>
        <button onclick="testTicketFilter('ind_alumno=N&prioridad=urgente', '🚨 Tickets urgentes de personal')">Personal Urgente</button>
        <button onclick="testTicketFilter('limit=5&offset=0', '📄 Primeros 5 tickets')">Paginación</button>
    </div>

    <div class="test-section">
        <h3>📊 Resultados</h3>
        <div id="results"></div>
        <button onclick="clearResults()">Limpiar</button>
    </div>

    <script>
        const results = document.getElementById('results');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function clearResults() {
            results.innerHTML = '';
        }

        async function testTicketFilter(queryParams, description) {
            const token = localStorage.getItem('authToken');
            const endpoint = `/api/tickets/mis-tickets?${queryParams}`;
            
            log(`🚀 ${description}`);
            log(`📍 Endpoint: ${endpoint}`);
            
            if (!token) {
                log('❌ Token no encontrado. Inicia sesión primero.', 'error');
                return;
            }

            try {
                const response = await fetch(endpoint, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const ticketCount = data.data?.length || 0;
                    log(`✅ ${description}: ${ticketCount} tickets devueltos`, 'success');
                    
                    // Analizar los roles de usuarios en los tickets devueltos
                    if (data.data && Array.isArray(data.data) && data.data.length > 0) {
                        const roles = data.data.map(t => t.usuario?.rol || 'sin_rol');
                        const rolesCount = roles.reduce((acc, rol) => {
                            acc[rol] = (acc[rol] || 0) + 1;
                            return acc;
                        }, {});
                        log(`👥 Distribución por roles: ${JSON.stringify(rolesCount)}`, 'success');
                        
                        // Mostrar algunos ejemplos
                        const ejemplos = data.data.slice(0, 3).map(t => ({
                            id: t.id,
                            titulo: t.titulo.substring(0, 30),
                            usuario_rol: t.usuario?.rol,
                            usuario_nombre: `${t.usuario?.nombre} ${t.usuario?.apellido}`
                        }));
                        log(`📋 Ejemplos: ${JSON.stringify(ejemplos, null, 2)}`, 'success');
                    } else {
                        log('📋 No hay tickets para mostrar', 'success');
                    }
                } else {
                    log(`❌ Error ${response.status}: ${data.message || 'Error desconocido'}`, 'error');
                    log(`📋 Respuesta completa: ${JSON.stringify(data, null, 2)}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error de conexión: ${error.message}`, 'error');
            }
            
            log('─'.repeat(50));
        }
    </script>
</body>
</html>
